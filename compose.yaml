name: sbdc

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: sbdc
      POSTGRES_USER: sbdc
      POSTGRES_PASSWORD: sbdc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbdc -d sbdc"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sbdc-local
      MINIO_ROOT_PASSWORD: sbdc-local-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 4s
      timeout: 3s
      retries: 30

  grobid:
    image: grobid/grobid:0.9.0-crf
    init: true
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 45s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://sbdc:sbdc@postgres:5432/sbdc
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: sbdc-local
      MINIO_SECRET_KEY: sbdc-local-secret
      MINIO_BUCKET: sbdc
      GROBID_URL: http://grobid:8070
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      grobid:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
