name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 4 * * 1'

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Foundation security check
        run: |
          test -f AGENTS.md
          test -f PROJECT_MEMORY.md
